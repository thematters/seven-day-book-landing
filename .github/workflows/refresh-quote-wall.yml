name: Auto-sync quote wall

# 金句牆全自動同步（不需人工、不開 PR）。
#
# 流程：定時 → 撈最新金句 → 有變動才 重新 subset 字型 + 直接 commit 進 main + 自己 build 部署。
# 延遲 = cron 間隔（每 6 小時）+ 部署時間；沒有新金句時整支跳過、不部署。
#
# 為什麼直接進 main（有別於 refresh-monthly.yml 刻意開 PR 給人潤稿）：
#   金句是使用者親手選的內容，沒有需要人 review 的東西，故直接同步。
#
# 為什麼自己 build+deploy（而非觸發 deploy.yml）：
#   GITHUB_TOKEN 的 push / workflow_dispatch 不會啟動別的 workflow（GitHub 防遞迴），
#   若靠觸發 deploy.yml 需要額外的 PAT secret。自己 build+deploy 就零 secret、零人工設定。
#
# scripts 全用 Matters public GraphQL，無需 secret。手動觸發：workflow_dispatch。

on:
  schedule:
    - cron: "0 */6 * * *" # 每 6 小時（UTC）；要多即時就調這行
  workflow_dispatch:

permissions:
  contents: write # 直接 commit 進 main
  pages: write # 部署 GitHub Pages
  id-token: write # 部署 GitHub Pages

concurrency:
  group: pages # 與 deploy.yml 同群組，避免同時部署 Pages
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
      - run: npm ci

      - name: 撈最新金句 → src/data/quote-wall.ts
        run: node scripts/fetch-quote-wall.mjs --write

      - name: 檢查金句是否有變動
        id: diff
        run: |
          if git diff --quiet src/data/quote-wall.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "沒有新金句，跳過部署。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 安裝 Python（重新 subset 字型用）
        if: steps.diff.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 依最新金句重新 subset 源泉圓體（避免新字缺字）
        if: steps.diff.outputs.changed == 'true'
        run: |
          pip install "fonttools[woff]" brotli
          bash scripts/subset-gensen.sh

      - name: Commit 進 main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/quote-wall.ts public/fonts/gensen-rounded-tw.subset.woff2
          git commit -m "chore(auto): 同步金句牆資料 + 字型 subset"
          git push

      - name: Build（有變動才建）
        if: steps.diff.outputs.changed == 'true'
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://thematters.github.io' }}
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}

      - name: 上傳 Pages artifact
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
